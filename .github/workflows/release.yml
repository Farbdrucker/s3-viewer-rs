name: Builds

# Every merge to main builds all platforms. When the version in Cargo.toml has
# no tag yet, the builds are published as release v<version>; the README links
# to the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::warning::v$version is already released. Bump the version in Cargo.toml to publish these builds."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [tests, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-arm64 }
          # macos-latest is Apple Silicon; the Intel build cross-compiles there.
          # (Pinned images such as macos-14 get retired and then fail to start.)
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir=s3-viewer-${{ matrix.name }}
          mkdir -p "$dir/themes"
          cp target/${{ matrix.target }}/release/s3-viewer README.md LICENSE packaging/linux/s3-viewer.desktop "$dir/"
          cp themes/*.toml "$dir/themes/"
          tar czf "$dir.tar.gz" "$dir"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="S3 Viewer.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/${{ matrix.target }}/release/s3-viewer "$app/Contents/MacOS/"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          dir=s3-viewer-${{ matrix.name }}
          mkdir -p "$dir/themes"
          mv "$app" "$dir/"
          cp README.md LICENSE "$dir/"
          cp themes/*.toml "$dir/themes/"
          ditto -c -k --keepParent "$dir" "$dir.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "s3-viewer-${{ matrix.name }}"
          New-Item -ItemType Directory -Force "$dir/themes" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/s3-viewer.exe", README.md, LICENSE "$dir/"
          Copy-Item themes/*.toml "$dir/themes/"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: s3-viewer-${{ matrix.name }}
          path: |
            s3-viewer-${{ matrix.name }}.tar.gz
            s3-viewer-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: [build, version]
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: S3 Viewer ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
